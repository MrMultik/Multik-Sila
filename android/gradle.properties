# -Djava.io.tmpdir обязателен, и вот почему.
#
# Для внутренних каналов (Selector.open -> Pipe) JVM на Windows 10+ создаёт
# сокет в домене Unix, то есть ФАЙЛ во временной папке. Путь такого сокета
# передаётся ядру побайтово и не переживает символов вне однобайтовой
# кодировки. У пользователя временная папка лежит в профиле с кириллическим
# именем (`C:\Users\Абилова Зарина\AppData\Local\Temp`), и сборка падала на
# ровном месте:
#
#   java.io.IOException: Unable to establish loopback connection
#   Caused by: java.net.SocketException: Invalid argument: connect
#       at sun.nio.ch.UnixDomainSockets.connect0(Native Method)
#
# Сообщение уводит в сторону — выглядит как заблокированная петля или
# firewall, хотя сама петля исправна (проверено отдельно, и IPv4, и IPv6).
# `gradlew --version` при этом проходит: там дело не доходит до открытия
# селектора.
#
# Путь ниже — латиницей и без пробелов. Заодно то же ограничение уже
# всплывало с Android SDK: его пришлось перенести из профиля в C:\dev.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.io.tmpdir=C:\\dev\\gradle-tmp
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
