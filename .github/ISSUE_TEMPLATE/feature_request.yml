name: Feature request
description: Suggest something the app could do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: English or Russian are both fine.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it would solve for you.
    validations:
      required: true
  - type: input
    id: elsewhere
    attributes:
      label: Seen it in another app?
      description: If another client already does this, name it — it helps to see how it works there.
      placeholder: "Karing, v2rayN, Hiddify…"
